<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カードラッシュ 状態B/C 買い得リスト</title>
<style>
:root{--bg:#0a0a18;--pa:#12122c;--bd:rgba(0,245,255,.18);--tx:#e8e8ff;--sub:#8a8ab0;
 --cy:#00f5ff;--pk:#ff00ff;--gd:#ffe600;--gr:#00e595;--rd:#ff4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'Segoe UI',system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:linear-gradient(90deg,#0d0d2a,var(--pa));
 border-bottom:1px solid var(--bd);padding:9px 12px}
.hd1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:14px;letter-spacing:2px;color:var(--cy);text-shadow:0 0 12px var(--cy);white-space:nowrap}
#reload{background:rgba(0,245,255,.12);border:1px solid var(--cy);border-radius:4px;color:var(--cy);
 font-size:11px;font-weight:700;padding:4px 12px;cursor:pointer;white-space:nowrap}
#reload:hover{background:rgba(0,245,255,.25)}
#reload:disabled{opacity:.5;cursor:default}
.meta{font-size:11px;color:var(--sub);margin-top:5px}
.meta b{color:var(--gd)}
.meta .new{color:var(--gr);font-weight:700}
.meta .gone{color:var(--rd);font-weight:700}
.meta.stale{color:var(--rd)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
select,input,.serbtn{background:#0a0a20;border:1px solid var(--bd);border-radius:4px;color:var(--tx);
 font-size:12px;padding:5px 8px}
input[type=number]{width:74px;text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rng{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--bd);border-radius:4px;padding:2px 6px}
.rng input{border:none;padding:3px 2px;background:transparent}
.rng span{font-size:10px;color:var(--sub);white-space:nowrap}
.tg{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;color:var(--sub);
 font-size:11px;padding:5px 10px;cursor:pointer}
.tg.on{background:rgba(0,245,255,.22);border-color:var(--cy);color:#fff;font-weight:700}
.tg.on.own{background:rgba(255,0,255,.22);border-color:var(--pk)}
.tg.on.sold{background:rgba(255,68,68,.22);border-color:var(--rd)}
.serbtn{cursor:pointer;white-space:nowrap}
.serbtn.on{border-color:var(--pk);color:#ff88ff;font-weight:700}
.hit{margin-left:auto;font-size:12px;color:var(--cy);font-weight:700;white-space:nowrap}

/* ── カードのタイル。1行1枚だと目が滑るので、店の一覧と同じ並べ方にする ── */
#grid{display:grid;gap:9px;padding:10px;
 grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
.card{background:var(--pa);border:1px solid rgba(255,255,255,.07);border-radius:6px;overflow:hidden;
 display:flex;flex-direction:column;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--cy);transform:translateY(-2px)}
.card.gone{opacity:.45}
.ph{position:relative;background:#06060f;padding:6px 6px 0}
.ph a{display:block}
.ph img{width:100%;aspect-ratio:63/88;object-fit:contain;display:block;border-radius:3px}
.ph .ni{width:100%;aspect-ratio:63/88;display:flex;align-items:center;justify-content:center;
 color:#2c2c44;font-size:10px}
.bdg{position:absolute;top:8px;display:flex;gap:3px;align-items:center}
.bdg.l{left:8px}.bdg.r{right:8px}
.b{font-size:9px;font-weight:900;border-radius:3px;padding:1px 5px;line-height:15px}
.b.B{background:rgba(255,230,0,.92);color:#2a2400}
.b.C{background:rgba(255,68,68,.92);color:#2a0000}
.b.own{background:rgba(255,0,255,.88);color:#fff}
.b.new{background:var(--gr);color:#06210f}
.b.sold{background:rgba(255,68,68,.95);color:#fff}
.bd{padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px;flex:1}
.nm{font-size:12px;font-weight:700;line-height:1.3;color:var(--tx);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st{font-size:9.5px;color:var(--sub);line-height:1.3;
 display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.pr{display:flex;align-items:baseline;gap:5px;margin-top:3px}
.pr .cr{font-size:15px;font-weight:900;color:var(--gr);font-variant-numeric:tabular-nums}
.pr .pc{font-size:10px;font-weight:700;color:var(--gd)}
.ref{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.ref s{color:#5f5f80}
.ref em{font-style:normal;color:var(--pk);font-weight:700}
.bar{height:4px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin:3px 0 1px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--gd))}
.lk{display:flex;gap:4px;margin-top:5px}
.lk a{flex:1;text-align:center;font-size:9.5px;font-weight:700;border-radius:3px;padding:3px 0;
 text-decoration:none;border:1px solid}
.lk a.c{color:var(--gr);border-color:rgba(0,229,149,.45)}
.lk a.c:hover{background:rgba(0,229,149,.18)}
.lk a.h{color:var(--gd);border-color:rgba(255,230,0,.4)}
.lk a.h:hover{background:rgba(255,230,0,.15)}
.stk{font-size:9px;color:var(--sub);margin-top:3px}
.stk.gone{color:var(--rd);font-weight:700}

/* シリーズの複数選択。selectだと1つしか選べないので自前のパネルを出す */
#serpanel{position:fixed;z-index:20;display:none;flex-direction:column;background:#0a0a20;
 border:1px solid rgba(255,0,255,.5);border-radius:6px;box-shadow:0 12px 34px rgba(0,0,0,.65);
 max-height:min(62vh,440px);overflow:hidden;min-width:250px}
#serpanel.open{display:flex}
#serpanel .sp-hd{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-shrink:0;
 border-bottom:1px solid rgba(255,0,255,.28);font-size:10px;font-weight:700;color:#ff88ff}
#serpanel .sp-hd span{margin-right:auto}
#serpanel .sp-hd button{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;
 color:rgba(255,255,255,.7);font-size:10px;padding:3px 8px;cursor:pointer;white-space:nowrap}
#serpanel .sp-list{overflow-y:auto;overscroll-behavior:contain}
#serpanel .sp-it{display:flex;align-items:center;gap:6px;padding:7px 9px;font-size:11px;
 cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);user-select:none}
#serpanel .sp-it:hover{background:rgba(255,0,255,.12)}
#serpanel .sp-it.sel{background:rgba(255,0,255,.18);color:#ff88ff;font-weight:700}
#serpanel .sp-ck{flex:0 0 12px;text-align:center;color:#ff88ff}
#serpanel .sp-n{margin-left:auto;color:var(--sub);font-size:10px;font-weight:400}

#note{color:var(--sub);font-size:11px;padding:8px 14px 30px;line-height:1.7}
#msg{padding:30px 14px;color:var(--sub);font-size:13px}
#more{height:1px}
@media(max-width:620px){
 #grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px;padding:7px}
 h1{font-size:12px;letter-spacing:1px}.ctl{gap:5px}
}
</style></head><body>
<header>
<div class="hd1"><h1>カードラッシュ 状態B/C 買い得リスト</h1>
 <button id="reload" title="最新のデータを取り直す">⟳ 更新</button></div>
<div class="meta" id="meta">読み込み中…</div>
<div class="ctl">
 <button class="tg on" id="f-cheap">割安のみ</button>
 <button class="tg" id="f-new">新着</button>
 <button class="tg sold" id="f-sold">売れた</button>
 <button class="tg" data-c="B">B</button>
 <button class="tg" data-c="C">C</button>
 <button class="tg" data-o="0">未所持</button>
 <button class="tg own" data-o="1">所持</button>
 <button class="serbtn" id="f-ser">シリーズ ▾</button>
 <span class="rng"><span>ラッシュ</span>
  <input type="number" id="f-lo" placeholder="下限" min="0" inputmode="numeric">
  <span>〜</span>
  <input type="number" id="f-hi" placeholder="上限" min="0" inputmode="numeric"></span>
 <select id="f-min"><option value="0">相場すべて</option><option value="1000">相場¥1,000+</option>
  <option value="5000">相場¥5,000+</option><option value="20000">相場¥20,000+</option>
  <option value="100000">相場¥100,000+</option></select>
 <select id="f-sort">
  <option value="save">差額の大きい順</option>
  <option value="ratio">割安な順（比率）</option>
  <option value="cr">ラッシュ 安い順</option>
  <option value="cr-">ラッシュ 高い順</option>
  <option value="price-">相場の高い順</option>
  <option value="name">カード名順</option>
 </select>
 <input type="search" id="q" placeholder="カード名で絞る">
 <span class="hit" id="hit"></span>
</div></header>
<div id="serpanel"><div class="sp-hd"><span>シリーズ（複数選べます）</span>
 <button type="button" id="sp-clr">全解除</button><button type="button" id="sp-cls">閉じる</button></div>
<div class="sp-list" id="sp-list"></div></div>
<div id="msg">データを読み込んでいます…</div>
<div id="grid"></div><div id="more"></div>
<div id="note">
状態B＝キズ・スレ・くすみ・小さな凹みあり。状態C＝全体のキズ、折れ、凹み、軽度の水濡れ等あり。
どちらも店側は「コレクション用にはお勧めしない」としています。プレイ用・穴埋め用として見てください。<br>
大きい数字がカードラッシュの価格、その下の取り消し線が相場（アプリ内の時価＝晴れる屋2の販売価格）です。<br>
データは毎朝5時に自動で取り直します。「⟳ 更新」でその最新を読み込みます。
</div>
<script>
const SRC='buylist-rush-bc.json', PAGE=200;
let rows=[], view=[], shown=0,
    st={cheap:1,flag:'',cond:'',own:'',ser:new Set(),lo:null,hi:null,min:0,q:'',sort:'save'};
const yen=v=>'¥'+(v||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const grid=document.getElementById('grid');

function toRows(d){
  const i=Object.fromEntries(d.cols.map((c,n)=>[c,n]));
  return d.items.map(a=>{
    const price=a[i.price], cr=a[i.cr];
    return {pid:a[i.pid],cond:a[i.cond],name:a[i.name],set:a[i.set],num:a[i.num],ser:a[i.ser]||'—',
      img:a[i.img],price:price,cr:cr,stock:a[i.stock],owned:a[i.owned],
      cheap:a[i.cheap],isnew:a[i.new],sold:i.sold==null?0:a[i.sold],
      soldAt:i.soldAt==null?'':a[i.soldAt],hr:i.hr==null?'':a[i.hr],
      ratio:price?cr/price:0,save:price-cr};
  });
}
function tile(r){
  const pc=Math.round(r.ratio*100);
  const cru='https://www.cardrush-pokemon.jp/product/'+esc(r.pid);
  return '<div class="card'+(r.sold?' gone':'')+'">'
    +'<div class="ph"><a href="'+cru+'" target="_blank" rel="noopener">'
    +(r.img?'<img loading="lazy" src="'+esc(r.img)+'" alt="">':'<div class="ni">画像なし</div>')
    +'</a>'
    +'<div class="bdg l"><span class="b '+r.cond+'">'+r.cond+'</span>'
      +(r.isnew?'<span class="b new">NEW</span>':'')
      +(r.sold?'<span class="b sold">売切</span>':'')+'</div>'
    +(r.owned>0?'<div class="bdg r"><span class="b own">×'+r.owned+'</span></div>':'')
    +'</div>'
    +'<div class="bd">'
    +'<div class="nm">'+esc(r.name)+'</div>'
    +'<div class="st">'+esc(r.set)+' '+esc(r.num)+'</div>'
    +'<div class="pr"><span class="cr">'+yen(r.cr)+'</span><span class="pc">'+pc+'%</span></div>'
    +'<div class="bar"><i style="width:'+Math.min(100,pc)+'%"></i></div>'
    +'<div class="ref">相場 <s>'+yen(r.price)+'</s> <em>-'+yen(r.save)+'</em></div>'
    +'<div class="stk'+(r.sold?' gone':'')+'">'
      +(r.sold?'売切 '+esc((r.soldAt||'').slice(5)):(r.stock?'在庫 '+r.stock+'枚':'在庫 —'))+'</div>'
    +'<div class="lk"><a class="c" href="'+cru+'" target="_blank" rel="noopener">ラッシュ</a>'
    +(r.hr?'<a class="h" href="https://www.hareruya2.com/products/'+esc(r.hr)+'" target="_blank" rel="noopener">晴れる屋2</a>':'')
    +'</div></div></div>';
}
function draw(){           // 一度に全部作ると重いので、スクロールに合わせて足していく
  const next=view.slice(shown, shown+PAGE);
  if(!next.length) return;
  grid.insertAdjacentHTML('beforeend', next.map(tile).join(''));
  shown+=next.length;
}
function apply(){
  const q=st.q;
  view=rows.filter(r=>
       (!st.cheap || r.cheap)
    && (st.flag==='new' ? r.isnew : st.flag==='sold' ? r.sold : !r.sold)
    && (!st.cond  || r.cond===st.cond)
    && (st.own===''|| (st.own==='1' ? r.owned>0 : r.owned===0))
    && (!st.ser.size || st.ser.has(r.ser))
    && (st.lo==null|| r.cr>=st.lo)
    && (st.hi==null|| r.cr<=st.hi)
    && (r.price>=st.min)
    && (!q || r.name.toLowerCase().includes(q) || (r.set||'').toLowerCase().includes(q)));
  // 差額・相場は大きい順、比率・ラッシュ価格・名前は小さい順が既定
  const k=st.sort.replace(/-$/,'');
  const dir=(k==='save'||st.sort==='price-'||st.sort==='cr-')?-1:1;
  view.sort((a,b)=>{const x=a[k],y=b[k];
    return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'ja'))*dir;});
  grid.innerHTML=''; shown=0; draw();
  document.getElementById('hit').textContent=view.length.toLocaleString()+'件';
}
function show(d){
  rows=toRows(d);
  const s=d.stats||{}, t=new Date(d.createdAt);
  const days=Math.floor((Date.now()-t.getTime())/86400000);
  const B=Math.round((d.th.B.med||0)*100), C=Math.round((d.th.C.med||0)*100);
  const bq=Math.round((d.th.B.q25||0)*100), cq=Math.round((d.th.C.q25||0)*100);
  const m=document.getElementById('meta');
  m.className='meta'+(days>=3?' stale':'');
  m.innerHTML=(isNaN(t)?'?':t.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))
    +' 時点'+(days>=3?'（'+days+'日前のデータです）':'')
    +' ／ 在庫のあるカード <b>'+(s.cards||rows.length).toLocaleString()+'</b>件'
    +(s.added?' ／ <span class="new">新着 '+s.added+'件</span>':'')
    +(s.sold ?' ／ <span class="gone">売れた '+s.sold+'件</span>':'')
    +'<br>状態Bは相場の<b>'+B+'%</b>、状態Cは<b>'+C+'%</b>が実勢の中央値なので、'
    +'それより明確に安い（B:'+bq+'%以下 / C:'+cq+'%以下）ものを「割安」としています。';
  [...st.ser].forEach(v=>{ if(!rows.some(r=>r.ser===v)) st.ser.delete(v); });
  serSync();
  document.getElementById('msg').hidden=true;
  apply();
}
async function load(force){
  const b=document.getElementById('reload');
  b.disabled=true; if(force) b.textContent='⟳ 取得中…';
  try{
    const r=await fetch(SRC+'?t='+Date.now(), force?{cache:'reload'}:{});
    if(!r.ok) throw new Error(r.status);
    show(await r.json());
  }catch(e){
    const m=document.getElementById('msg');
    m.hidden=false;
    m.textContent='データを読み込めませんでした（'+e.message+'）。時間をおいて「⟳ 更新」を押してください。';
  }
  b.disabled=false; b.textContent='⟳ 更新';
}
// 下まで来たら続きを描く
new IntersectionObserver(es=>{ if(es[0].isIntersecting) draw(); },{rootMargin:'800px'})
  .observe(document.getElementById('more'));

document.getElementById('reload').onclick=()=>load(true);
document.getElementById('f-cheap').onclick=function(){st.cheap=st.cheap?0:1;this.classList.toggle('on',!!st.cheap);apply();};
// 新着 / 売れた は排他。どちらもOFFのときは在庫のあるものだけ出す
document.querySelectorAll('#f-new,#f-sold').forEach(b=>b.onclick=function(){
  const k=this.id==='f-new'?'new':'sold';
  st.flag = st.flag===k ? '' : k;
  document.querySelectorAll('#f-new,#f-sold').forEach(x=>x.classList.remove('on'));
  if(st.flag)this.classList.add('on');
  apply();});
document.querySelectorAll('.tg[data-c]').forEach(b=>b.onclick=function(){
  const on=st.cond===this.dataset.c; st.cond=on?'':this.dataset.c;
  document.querySelectorAll('.tg[data-c]').forEach(x=>x.classList.remove('on'));
  if(!on)this.classList.add('on'); apply();});
document.querySelectorAll('.tg[data-o]').forEach(b=>b.onclick=function(){
  const on=st.own===this.dataset.o; st.own=on?'':this.dataset.o;
  document.querySelectorAll('.tg[data-o]').forEach(x=>x.classList.remove('on'));
  if(!on)this.classList.add('on'); apply();});
document.getElementById('f-min').onchange=function(){st.min=+this.value;apply();};
document.getElementById('f-sort').onchange=function(){st.sort=this.value;apply();};
const num=v=>v===''||isNaN(+v)?null:+v;
document.getElementById('f-lo').oninput=function(){st.lo=num(this.value);apply();};
document.getElementById('f-hi').oninput=function(){st.hi=num(this.value);apply();};
document.getElementById('q').oninput=function(){st.q=this.value.trim().toLowerCase();apply();};

// シリーズは複数選択。選ぶたびに閉じないパネルを出す
const serBtn=document.getElementById('f-ser'), serPanel=document.getElementById('serpanel'),
      serList=document.getElementById('sp-list');
let serOpen=false;
function serPlace(){
  const b=serBtn.getBoundingClientRect();
  const w=Math.min(Math.max(b.width,250), innerWidth-16);
  serPanel.style.left=Math.max(8,Math.min(b.left, innerWidth-8-w))+'px';
  serPanel.style.top=(b.bottom+4)+'px';
  serPanel.style.width=w+'px';
}
function serSync(){
  const cnt={};
  for(const r of rows) cnt[r.ser]=(cnt[r.ser]||0)+1;
  serList.innerHTML=[...new Set(rows.map(r=>r.ser))].sort((a,b)=>a.localeCompare(b,'ja'))
    .map(v=>'<div class="sp-it'+(st.ser.has(v)?' sel':'')+'" data-v="'+esc(v)+'">'
      +'<span class="sp-ck">'+(st.ser.has(v)?'✓':'')+'</span>'+esc(v)
      +'<span class="sp-n">'+cnt[v]+'</span></div>').join('');
  serBtn.textContent = st.ser.size ? 'シリーズ '+st.ser.size+'件 ▾' : 'シリーズ ▾';
  serBtn.classList.toggle('on', st.ser.size>0);
}
function serShow(v){
  serOpen = v===undefined ? !serOpen : v;
  serPanel.classList.toggle('open',serOpen);
  if(serOpen){ serPlace(); serSync(); }
}
serBtn.onclick=e=>{e.stopPropagation();serShow();};
serPanel.onclick=e=>{
  e.stopPropagation();
  if(e.target.id==='sp-cls'){serShow(false);return;}
  if(e.target.id==='sp-clr'){st.ser.clear();serSync();apply();return;}
  const it=e.target.closest('.sp-it'); if(!it)return;
  const v=it.dataset.v;
  st.ser.has(v)?st.ser.delete(v):st.ser.add(v);
  serSync(); apply();          // パネルは閉じない
};
addEventListener('pointerdown',e=>{ if(serOpen && !serPanel.contains(e.target) && e.target!==serBtn) serShow(false); },true);
addEventListener('keydown',e=>{ if(serOpen && e.key==='Escape') serShow(false); });
addEventListener('scroll',()=>{ if(serOpen) serPlace(); },true);
addEventListener('resize',()=>{ if(serOpen) serPlace(); });

load(false);
</script></body></html>
