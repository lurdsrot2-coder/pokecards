<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>カードラッシュ 状態B/C 買い得リスト</title>
<style>
:root{--bg:#0a0a18;--pa:#12122c;--bd:rgba(0,245,255,.18);--tx:#e8e8ff;--sub:#8a8ab0;
 --cy:#00f5ff;--pk:#ff00ff;--gd:#ffe600;--gr:#00e595;--rd:#ff4444}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.5 'Segoe UI',system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:linear-gradient(90deg,#0d0d2a,var(--pa));
 border-bottom:1px solid var(--bd);padding:9px 14px}
.hd1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0;font-size:14px;letter-spacing:2px;color:var(--cy);text-shadow:0 0 12px var(--cy);white-space:nowrap}
#reload{background:rgba(0,245,255,.12);border:1px solid var(--cy);border-radius:4px;color:var(--cy);
 font-size:11px;font-weight:700;padding:4px 12px;cursor:pointer;white-space:nowrap}
#reload:hover{background:rgba(0,245,255,.25)}
#reload:disabled{opacity:.5;cursor:default}
.meta{font-size:11px;color:var(--sub);margin-top:5px}
.meta b{color:var(--gd)}
.meta .new{color:var(--gr);font-weight:700}
.meta .gone{color:var(--rd);font-weight:700}
.meta.stale{color:var(--rd)}
.ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
select,input{background:#0a0a20;border:1px solid var(--bd);border-radius:4px;color:var(--tx);
 font-size:12px;padding:5px 8px}
input[type=number]{width:82px;text-align:right;-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rng{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);border-radius:4px;padding:2px 6px}
.rng input{border:none;padding:3px 2px;background:transparent}
.rng span{font-size:10px;color:var(--sub);white-space:nowrap}
.tg{background:transparent;border:1px solid rgba(255,255,255,.2);border-radius:4px;color:var(--sub);
 font-size:11px;padding:5px 10px;cursor:pointer}
.tg.on{background:rgba(0,245,255,.22);border-color:var(--cy);color:#fff;font-weight:700}
.tg.on.own{background:rgba(255,0,255,.22);border-color:var(--pk)}
.hit{margin-left:auto;font-size:12px;color:var(--cy);font-weight:700;white-space:nowrap}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:0;background:#141433;font-size:11px;color:var(--sub);text-align:left;
 padding:7px 8px;border-bottom:1px solid var(--bd);cursor:pointer;white-space:nowrap;user-select:none}
th.up::after{content:' ▲';color:var(--cy)}th.down::after{content:' ▼';color:var(--cy)}
td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tr:hover{background:rgba(0,245,255,.06)}
.im{width:44px;padding:3px}.im img{width:40px;border-radius:3px;display:block}
.nm a{color:var(--tx);text-decoration:none;font-weight:600}
.nm a:hover{color:var(--cy);text-decoration:underline}
.sub{font-size:10px;color:var(--sub)}
.sub .mo{display:none}
.num{margin-left:6px;color:#6a6a90}
.tagnew{display:inline-block;background:var(--gr);color:#06210f;font-size:9px;font-weight:900;
 border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}
.se{font-size:11px;color:#b9b9e0;white-space:nowrap}
.cond{text-align:center;font-weight:900;width:28px}
.cond.B{color:var(--gd)}.cond.C{color:var(--rd)}
.ow{text-align:center;width:34px;font-weight:700;color:#3a3a55}
.ow.has{color:var(--pk)}
.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.cr{color:var(--gr);font-weight:700}
.sv{color:var(--pk);font-weight:700}
.pc{color:var(--sub)}
.bar{display:inline-block;width:38px;height:5px;background:rgba(255,255,255,.12);border-radius:3px;
 margin-right:6px;overflow:hidden;vertical-align:middle}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gr),var(--gd))}
.st{font-size:11px;color:var(--sub);text-align:right;white-space:nowrap}
#note{color:var(--sub);font-size:11px;padding:14px;line-height:1.7}
#msg{padding:30px 14px;color:var(--sub);font-size:13px}
@media(max-width:700px){
 /* 横スクロールさせないため、相場は名前の下に畳んで列から外す */
 .se,.st,.pc,.pr,th[data-k="ser"],th[data-k="stock"]{display:none}
 .sub .mo{display:inline;margin-left:6px;color:#b9b9e0}
 .im{width:34px}.im img{width:30px}
 td,th{padding:5px 5px}
 h1{font-size:12px;letter-spacing:1px}.ctl{gap:5px}}
</style></head><body>
<header>
<div class="hd1"><h1>カードラッシュ 状態B/C 買い得リスト</h1>
 <button id="reload" title="最新のデータを取り直す">⟳ 更新</button></div>
<div class="meta" id="meta">読み込み中…</div>
<div class="ctl">
 <button class="tg on" id="f-cheap">割安のみ</button>
 <button class="tg" id="f-new">新着のみ</button>
 <button class="tg" data-c="B">B</button>
 <button class="tg" data-c="C">C</button>
 <button class="tg" data-o="0">未所持</button>
 <button class="tg own" data-o="1">所持</button>
 <select id="f-ser"><option value="">全シリーズ</option></select>
 <span class="rng"><span>ラッシュ</span>
  <input type="number" id="f-lo" placeholder="下限" min="0" inputmode="numeric">
  <span>〜</span>
  <input type="number" id="f-hi" placeholder="上限" min="0" inputmode="numeric"></span>
 <select id="f-min"><option value="0">相場すべて</option><option value="1000">相場¥1,000+</option>
  <option value="5000">相場¥5,000+</option><option value="20000">相場¥20,000+</option>
  <option value="100000">相場¥100,000+</option></select>
 <input type="search" id="q" placeholder="カード名で絞る">
 <span class="hit" id="hit"></span>
</div></header>
<div id="msg">データを読み込んでいます…</div>
<table id="tbl" hidden><thead><tr>
<th></th><th data-k="name">カード</th><th data-k="ser">シリーズ</th><th data-k="cond">状態</th>
<th data-k="owned" class="n">所持</th>
<th data-k="price" class="n pr">相場</th><th data-k="cr" class="n">ラッシュ</th>
<th data-k="ratio" class="n pc">比率</th><th data-k="save" class="n">差額</th><th data-k="stock" class="n">在庫</th>
</tr></thead><tbody id="tb"></tbody></table>
<div id="note">
状態B＝キズ・スレ・くすみ・小さな凹みあり。状態C＝全体のキズ、折れ、凹み、軽度の水濡れ等あり。
どちらも店側は「コレクション用にはお勧めしない」としています。プレイ用・穴埋め用として見てください。<br>
カード名を押すとカードラッシュの商品ページが開きます。売り切れの商品は除いてあります。<br>
「⟳ 更新」で最新のデータを取り直します（売れたものは消え、新しく出たものには <span class="tagnew">NEW</span> が付きます）。
</div>
<script>
const SRC='buylist-rush-bc.json';
let DATA=null, rows=[], st={cheap:1,new:0,cond:'',own:'',ser:'',lo:null,hi:null,min:0,q:''},
    sortK='save', sortD=-1;
const yen=v=>'¥'+(v||0).toLocaleString();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function toRows(d){
  const i=Object.fromEntries(d.cols.map((c,n)=>[c,n]));
  return d.items.map(a=>{
    const price=a[i.price], cr=a[i.cr];
    return {pid:a[i.pid],cond:a[i.cond],name:a[i.name],set:a[i.set],num:a[i.num],ser:a[i.ser]||'—',
      img:a[i.img],price:price,cr:cr,stock:a[i.stock],owned:a[i.owned],
      cheap:a[i.cheap],isnew:a[i.new],ratio:price?cr/price:0,save:price-cr};
  });
}
function render(list){
  const h=[];
  for(const r of list){
    const pc=Math.round(r.ratio*100);
    h.push('<tr><td class="im">'+(r.img?'<img loading="lazy" src="'+esc(r.img)+'" alt="">':'')+'</td>'
      +'<td class="nm"><a href="https://www.cardrush-pokemon.jp/product/'+esc(r.pid)+'" target="_blank" rel="noopener">'
      +esc(r.name)+'</a>'+(r.isnew?'<span class="tagnew">NEW</span>':'')
      +'<div class="sub">'+esc(r.set)+'<span class="num">'+esc(r.num)+'</span>'
      +'<span class="mo">相場'+yen(r.price)+'</span></div></td>'
      +'<td class="se">'+esc(r.ser)+'</td>'
      +'<td class="cond '+r.cond+'">'+r.cond+'</td>'
      +'<td class="ow'+(r.owned>0?' has':'')+'">'+(r.owned>0?r.owned:'–')+'</td>'
      +'<td class="n pr">'+yen(r.price)+'</td><td class="n cr">'+yen(r.cr)+'</td>'
      +'<td class="n pc"><span class="bar"><i style="width:'+Math.min(100,pc)+'%"></i></span>'+pc+'%</td>'
      +'<td class="n sv">'+yen(r.save)+'</td>'
      +'<td class="st">'+(r.stock?r.stock+'枚':'—')+'</td></tr>');
  }
  document.getElementById('tb').innerHTML=h.join('');
  document.getElementById('hit').textContent=list.length.toLocaleString()+'件';
}
function apply(){
  const q=st.q;
  let list=rows.filter(r=>
       (!st.cheap || r.cheap)
    && (!st.new   || r.isnew)
    && (!st.cond  || r.cond===st.cond)
    && (st.own===''|| (st.own==='1' ? r.owned>0 : r.owned===0))
    && (!st.ser   || r.ser===st.ser)
    && (st.lo==null|| r.cr>=st.lo)
    && (st.hi==null|| r.cr<=st.hi)
    && (r.price>=st.min)
    && (!q || r.name.toLowerCase().includes(q) || (r.set||'').toLowerCase().includes(q)));
  const dir=sortD, k=sortK;
  list.sort((a,b)=>{
    const x=a[k], y=b[k];
    return (typeof x==='number' ? x-y : String(x).localeCompare(String(y),'ja'))*dir;
  });
  render(list);
}
function sort(k){
  // 比率とラッシュ価格は「安い順」から見たいので、初回は昇順
  sortD = (k===sortK) ? -sortD : (['ratio','cr'].includes(k)?1:-1);
  sortK = k;
  document.querySelectorAll('th').forEach(t=>t.classList.remove('up','down'));
  const th=document.querySelector('th[data-k="'+k+'"]'); if(th) th.classList.add(sortD>0?'up':'down');
  apply();
}
function show(d){
  DATA=d; rows=toRows(d);
  const s=d.stats||{}, t=new Date(d.createdAt);
  const days=Math.floor((Date.now()-t.getTime())/86400000);
  const B=Math.round((d.th.B.med||0)*100), C=Math.round((d.th.C.med||0)*100);
  const bq=Math.round((d.th.B.q25||0)*100), cq=Math.round((d.th.C.q25||0)*100);
  const m=document.getElementById('meta');
  m.className='meta'+(days>=3?' stale':'');
  m.innerHTML=(isNaN(t)?'?':t.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))
    +' 時点'+(days>=3?'（'+days+'日前のデータです）':'')
    +' ／ 在庫のあるカード <b>'+(s.cards||rows.length).toLocaleString()+'</b>件'
    +(s.added?' ／ <span class="new">新着 '+s.added+'件</span>':'')
    +(s.sold ?' ／ <span class="gone">売れた '+s.sold+'件</span>':'')
    +'<br>相場＝アプリ内の時価（晴れる屋2の販売価格）。状態Bは相場の<b>'+B+'%</b>、状態Cは<b>'+C+'%</b>が実勢の中央値なので、'
    +'それより明確に安い（B:'+bq+'%以下 / C:'+cq+'%以下）ものを「割安」としています。';
  const sel=document.getElementById('f-ser');
  const sers=[...new Set(rows.map(r=>r.ser))].sort((a,b)=>a.localeCompare(b,'ja'));
  sel.innerHTML='<option value="">全シリーズ</option>'+sers.map(s=>'<option>'+esc(s)+'</option>').join('');
  document.getElementById('msg').hidden=true;
  document.getElementById('tbl').hidden=false;
  sortK=''; sortD=-1; sort('save');   // 差額の大きい順から見せる
}
async function load(force){
  const b=document.getElementById('reload');
  b.disabled=true; if(force) b.textContent='⟳ 取得中…';
  try{
    const r=await fetch(SRC+'?t='+Date.now(), force?{cache:'reload'}:{});
    if(!r.ok) throw new Error(r.status);
    show(await r.json());
  }catch(e){
    document.getElementById('msg').hidden=false;
    document.getElementById('msg').textContent='データを読み込めませんでした（'+e.message+'）。時間をおいて「⟳ 更新」を押してください。';
  }
  b.disabled=false; b.textContent='⟳ 更新';
}
document.getElementById('reload').onclick=()=>load(true);
document.getElementById('f-cheap').onclick=function(){st.cheap=st.cheap?0:1;this.classList.toggle('on',!!st.cheap);apply();};
document.getElementById('f-new').onclick=function(){st.new=st.new?0:1;this.classList.toggle('on',!!st.new);apply();};
document.querySelectorAll('.tg[data-c]').forEach(b=>b.onclick=function(){
  const on=st.cond===this.dataset.c; st.cond=on?'':this.dataset.c;
  document.querySelectorAll('.tg[data-c]').forEach(x=>x.classList.remove('on'));
  if(!on)this.classList.add('on'); apply();});
document.querySelectorAll('.tg[data-o]').forEach(b=>b.onclick=function(){
  const on=st.own===this.dataset.o; st.own=on?'':this.dataset.o;
  document.querySelectorAll('.tg[data-o]').forEach(x=>x.classList.remove('on'));
  if(!on)this.classList.add('on'); apply();});
document.getElementById('f-ser').onchange=function(){st.ser=this.value;apply();};
document.getElementById('f-min').onchange=function(){st.min=+this.value;apply();};
const num=v=>v===''||isNaN(+v)?null:+v;
document.getElementById('f-lo').oninput=function(){st.lo=num(this.value);apply();};
document.getElementById('f-hi').oninput=function(){st.hi=num(this.value);apply();};
document.getElementById('q').oninput=function(){st.q=this.value.trim().toLowerCase();apply();};
document.querySelectorAll('th[data-k]').forEach(t=>t.onclick=()=>sort(t.dataset.k));
load(false);
</script></body></html>
